# The west manifest file for upstream Zephyr.
#
# The per-installation west configuration file, .west/config, sets the
# path to the project containing this file in the [manifest] section's
# "path" variable.
#
# You are free to create your own manifest files and put them in any
# repository you want, to create your own custom Zephyr installations.
# For example, you could create a manifest file in your own out of
# tree application directory, which would pull this zephyr repository
# in as an ordinary project.
#
# You can pass your manifest repositories to west init when creating a
# new Zephyr installation. See the west documentation for more
# information.

manifest:

  remotes:
    - name: upstream
      url-base: https://mirror.rtkbf.com/gerrit

  defaults:
    remote: upstream

  projects:
    - name: cmsis
      revision: 4b96cbb174678dcd3ca86e11e1f24bc5f8726da0
      url: https://mirror.rtkbf.com/gerrit/github/zephyrproject-rtos/cmsis
      path: modules/hal/cmsis
      groups:
        - hal
    - name: fatfs
      revision: 427159bf95ea49b7680facffaa29ad506b42709b
      url: https://mirror.rtkbf.com/gerrit/github/zephyrproject-rtos/fatfs
      path: modules/fs/fatfs
      groups:
        - fs
    - name: mbedtls
      revision: a78176c6ff0733ba08018cba4447bd3f20de7978
      url: https://mirror.rtkbf.com/gerrit/github/zephyrproject-rtos/mbedtls
      path: modules/crypto/mbedtls
      groups:
        - crypto
    - name: tinycrypt
      revision: 1012a3ebee18c15ede5efc8332ee2fc37817670f
      url: https://mirror.rtkbf.com/gerrit/github/zephyrproject-rtos/tinycrypt
      path: modules/crypto/tinycrypt
      groups:
        - crypto

  self:
    path: zephyr
    west-commands: scripts/west-commands.yml
    import: submanifests
