description: |
  RTL87X3G DMA controller

  channel: Select channel for data transmitting

  slot: Handshake index, ref to rtl_gdma_def.h

  config: A 32bit mask specifying the DMA channel configuration
    - bit 0-1:     Direction  (see dma.h)
                 - 0x0: MEMORY to MEMORY
                 - 0x1: MEMORY to PERIPH
                 - 0x2: PERIPH to MEMORY
                 - 0x3: PERIPH to PERIPH(reserved)

    - bit 2-3:     Source address increase
                 - 0x0: increment address between transfers
                 - 0x1: decrement address between transfers
                 - 0x2: no address increment between transfers
                 - 0x3: reserved

    - bit 4-5:     Destination address increase
                 - 0x0: increment address between transfers
                 - 0x1: decrement address between transfers
                 - 0x2: no address increment between transfers
                 - 0x3: reserved

    - bit 6-7:     Source data width
                 - 0x0: 8 bits
                 - 0x1: 16 bits
                 - 0x2: 32 bits
                 - 0x3: reserved

    - bit 8-9:     Destination data width
                 - 0x0: 8 bits
                 - 0x1: 16 bits
                 - 0x2: 32 bits
                 - 0x3: reserved

    - bit 10-12:   Source data msize,
                   RTL87X3G supports 1/4/8/16/32/64/128.
                 - 0x0: msize 1
                 - 0x1: msize 4
                 - 0x2: msize 8
                 - 0x3: msize 16
                 - 0x4: msize 32
                 - 0x5: msize 64
                 - 0x6: msize 128
                 - 0x7: msize 256

    - bit 13-15:   Destination data width
                   RTL87X3G supports 1/4/8/16/32/64/128.
                 - 0x0: msize 1
                 - 0x1: msize 4
                 - 0x2: msize 8
                 - 0x3: msize 16
                 - 0x4: msize 32
                 - 0x5: msize 64
                 - 0x6: msize 128
                 - 0x7: msize 256

    - bit 16-20:   Priority
                   RTL87X3G supports 0~15.
                 - 0 ~ 15 can be configured

  Example of devicetree configuration

  Include <zephyr/dt-bindings/dma/rtl87x3g-dma.h> and compose the slot and
  config cells from the named macros instead of writing raw numbers:

  #include <zephyr/dt-bindings/dma/rtl87x3g-dma.h>

  &uart2 {
        status = "okay";
        dmas = <&dma0 2 RTL87X3G_DMA_HANDSHAKE_UART2_RX
                        (RTL87X3G_DMA_P2M
                         | RTL87X3G_DMA_SRC_FIXED
                         | RTL87X3G_DMA_DST_INC
                         | RTL87X3G_DMA_SRC_WIDTH_8BIT
                         | RTL87X3G_DMA_DST_WIDTH_8BIT
                         | RTL87X3G_DMA_SRC_MSIZE(RTL87X3G_DMA_MSIZE_1)
                         | RTL87X3G_DMA_DST_MSIZE(RTL87X3G_DMA_MSIZE_1)
                         | RTL87X3G_DMA_PRIORITY(0))>,
               <&dma0 3 RTL87X3G_DMA_HANDSHAKE_UART2_TX
                        (RTL87X3G_DMA_M2P
                         | RTL87X3G_DMA_SRC_INC
                         | RTL87X3G_DMA_DST_FIXED
                         | RTL87X3G_DMA_SRC_WIDTH_8BIT
                         | RTL87X3G_DMA_DST_WIDTH_8BIT
                         | RTL87X3G_DMA_SRC_MSIZE(RTL87X3G_DMA_MSIZE_1)
                         | RTL87X3G_DMA_DST_MSIZE(RTL87X3G_DMA_MSIZE_1)
                         | RTL87X3G_DMA_PRIORITY(1))>;
        dma-names = "rx", "tx";
  };

  "uart2" uses dma0 for transmitting and receiving in the example.
  Each is named "rx" and "tx".
  The channel cell assigns channel 2 to receive and channel 3 to transmit.
  The slot cell configs specified handshake for different peripherals.
  The config cell can take various configs, composed from the RTL87X3G_DMA_*
  macros above; the raw bit layout is documented in the "config" field below.
  But the setting used depends on each driver implementation.
  Set the priority for the transmitting channel as HIGH, LOW(the default) for receive channel.

compatible: "realtek,rtl87x3g-dma"

include: dma-controller.yaml

properties:
  reg:
    required: true

  interrupts:
    required: true

  dma-channels:
    required: true

  clocks:
    required: true

  dma-port:
    type: int
    required: true

  "#dma-cells":
    const: 3

dma-cells:
  - channel
  - slot
  - config
