description: RTL87X3G PWM

compatible: "realtek,rtl87x3g-pwm"

include: [base.yaml, pwm-controller.yaml, pinctrl-device.yaml]

properties:
  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  clocks:
    required: false

  "#pwm-cells":
    const: 3

pwm-cells:
  - channel
  - period
  - flags
